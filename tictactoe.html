<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chinese Tic Tac Toe</title>
    <!-- Game sound effects -->
    <audio id="playerMoveSound" src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3"
        preload="auto"></audio>
    <audio id="computerMoveSound" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3"
        preload="auto"></audio>
    <audio id="winSound" src="https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3" preload="auto"></audio>
    <audio id="drawSound" src="https://assets.mixkit.co/active_storage/sfx/951/951-preview.mp3" preload="auto"></audio>
    <!-- Tournament victory sound -->
    <audio id="tournamentSound" src="https://assets.mixkit.co/active_storage/sfx/387/387-preview.mp3"
        preload="auto"></audio>
    <style>
        :root {
            --red: #b91c1c;
            --gold: #facc15;
            --deep: #7f1d1d;
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            background: url('./38130.jpg');
            background-size: cover;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--deep);
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
            margin: 0 auto;
            max-width: 960px;
        }

        button {
            background-color: var(--red);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: var(--deep);
        }

        /* Layout: scoreboard left, play area center */
        .game-area {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }

        .scoreboard {
            width: 220px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .play-area {
            flex: 1 1 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .board-container {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 12px 0;
        }

        .game-board {
            display: grid;
            grid-template-columns: repeat(3, 110px);
            gap: 8px;
            margin: 0 auto;
        }

        .cell {
            width: 110px;
            height: 110px;
            background: white;
            border: 2px solid var(--red);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 44px;
            cursor: pointer;
            transition: background-color 0.18s, transform 0.12s;
            border-radius: 8px;
        }

        /* Hover styles vary by current player */
        .game-board.p1-turn .cell:hover {
            background-color: rgba(185, 28, 28, 0.08);
            transform: translateY(-4px);
        }

        .game-board.p2-turn .cell:hover {
            background-color: rgba(250, 204, 21, 0.12);
            transform: translateY(-4px);
        }

        .status {
            margin: 20px 0;
            font-size: 1.2rem;
            text-align: center;
        }

        .player-score {
            text-align: center;
            padding: 12px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            transition: transform 0.18s, box-shadow 0.18s;
        }

        .player-score.current {
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.18);
            transform: translateX(6px);
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            from {
                transform: translateX(4px) scale(1);
            }

            to {
                transform: translateX(8px) scale(1.02);
            }
        }

        .back-to-dashboard {
            margin-top: 20px;
        }

        /* Result Modal Styles */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
            text-align: center;
            max-width: 400px;
            width: 90%;
            animation: modalPop 0.3s ease-out;
        }

        @keyframes modalPop {
            from {
                transform: scale(0.8);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .modal h2 {
            color: var(--red);
            margin: 0 0 1rem;
            font-size: 1.8rem;
        }

        .modal p {
            font-size: 1.2rem;
            margin: 1rem 0;
        }

        .modal button {
            margin: 0.5rem;
        }

        /* Player name modal (replaces prompt) */
        .name-modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1100;
            display: grid;
            place-items: center;
        }

        .name-modal {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.95), rgba(255, 255, 255, 0.95));
            padding: 24px;
            border-radius: 12px;
            width: 320px;
            text-align: center;
            box-shadow: 0 14px 40px rgba(0, 0, 0, 0.12);
        }

        .name-modal h2 {
            color: var(--red);
            margin: 0 0 16px 0;
            font-size: 1.5rem;
        }

        .player-name-input {
            box-sizing: border-box;
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 2px solid var(--red);
            border-radius: 8px;
            font-size: 16px
        }

        /* Back buttons (match other games) */
        .back-btn-gradient {
            background: linear-gradient(45deg, var(--red), #ef4444);
            color: #fff;
            border: 2px solid var(--gold);
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
            text-transform: none;
            font-weight: bold;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            padding: 10px;
            border-radius: 10px;
            display: inline-block;
            text-decoration: none;
        }

        @media (max-width: 400px) {
            .game-board {
                grid-template-columns: repeat(3, 72px);
                gap: 6px;
            }

            .cell {
                width: 72px;
                height: 72px;
                font-size: 26px
            }

            .scoreboard {
                width: 140px
            }
        }

        /* Confetti styles */
        .confetti-container {
            position: fixed;
            pointer-events: none;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            overflow: visible;
            z-index: 2000;
        }

        .confetti {
            position: absolute;
            top: -10vh;
            width: 10px;
            height: 14px;
            border-radius: 2px;
            transform-origin: center;
            animation-name: confetti-fall;
            animation-timing-function: cubic-bezier(.2, .6, .2, 1);
            will-change: transform, opacity;
        }

        @keyframes confetti-fall {
            100% {
                transform: translateY(115vh) rotate(720deg);
                opacity: 1;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1 style="color: var(--red); text-align: center;">Chinese Tic Tac Toe</h1>

        <div class="game-area">
            <div class="scoreboard" id="scoreboard">
                <div class="player-score" id="score-p1">
                    <h3 id="p1name">Player 1</h3>
                    <p>Current Score: <span id="p1score">0</span></p>
                    <p>Matches Won: <span id="p1matches">0</span> / 3</p>
                </div>
                <div class="player-score" id="score-p2">
                    <h3 id="p2name">Computer</h3>
                    <p>Current Score: <span id="p2score">0</span></p>
                    <p>Matches Won: <span id="p2matches">0</span> / 3</p>
                </div>
                <div style="display:flex; gap:8px; margin-top:8px;">
                    <button onclick="startNewTournament()">New Game</button>
                    <button onclick="resetScores()">Reset Tournament</button>
                </div>
            </div>

            <div class="play-area">
                <div class="status" id="status"></div>
                <div class="board-container">
                    <div class="game-board" id="board"></div>
                </div>
                <div style="margin-top:8px;">
                    <a href="index.html" class="back-btn-gradient">Back to Dashboard</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Result Modal -->
    <div class="modal-overlay" id="resultModal">
        <div class="modal">
            <h2 id="modalTitle">Game Over!</h2>
            <p id="modalMessage"></p>
            <div id="modalButtons">
                <!-- Tournament Victory buttons -->
                <div id="tournamentButtons" style="display: none;">
                    <button onclick="startNewTournament()">New Tournament</button>
                    <button onclick="window.location.href='index.html'">Back to Dashboard</button>
                </div>
                <!-- Round Result buttons are not shown for regular rounds -->
            </div>
        </div>
    </div>

    <div class="name-modal-overlay" id="playerNameModal">
        <div class="name-modal">
            <h2>Enter Your Name</h2>
            <input id="playerNameInput" class="player-name-input" maxlength="20" placeholder="Enter your name">
            <div style="display:flex;gap:8px;justify-content:center;margin-top:8px">
                <button id="confirmNameBtn" class="btn">Start Playing!</button>
                <a id="backNameBtn" href="index.html" class="back-btn-gradient">Back to Dashboard</a>
            </div>
        </div>
    </div>

    <script>
        // --- SOUND INITIALIZATION ---
        const playerMoveSound = document.getElementById('playerMoveSound');
        const computerMoveSound = document.getElementById('computerMoveSound');
        const winSound = document.getElementById('winSound');
        const drawSound = document.getElementById('drawSound');
        const tournamentSound = document.getElementById('tournamentSound');

        // Create AudioContext for consistent playback unlocking
        let audioCtx;
        function unlockAudio() {
            if (!audioCtx) {
                try {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                } catch (e) {
                    console.warn("AudioContext not supported.");
                    return;
                }
            }
            if (audioCtx.state === "suspended") {
                audioCtx.resume().catch(() => { });
            }
            // Force all sounds to play once silently to unlock
            [playerMoveSound, computerMoveSound, winSound, drawSound, tournamentSound].forEach(sound => {
                sound.volume = 0;
                sound.play().then(() => {
                    sound.pause();
                    sound.currentTime = 0;
                    sound.volume = 1.0;
                }).catch(() => { });
            });
        }

        // Unlock on any user gesture
        window.addEventListener("click", unlockAudio, { once: true });
        window.addEventListener("keydown", unlockAudio, { once: true });

        let currentPlayer = '✕';
        let board = ['', '', '', '', '', '', '', '', ''];
        let gameActive = false;
        let scores = { player1: 0, player2: 0 };
        let matches = { player1: 0, player2: 0 };
        let player1Name = 'Player 1';
        let player2Name = 'Player 2';
        let playerVsComputer = true;
        const MATCHES_TO_WIN = 3;

        function getRandomStartingPlayer() {
            return Math.random() < 0.5 ? '✕' : '○';
        }

        function makeComputerMove() {
            if (!gameActive || currentPlayer !== '○') return;
            const computerMove = getComputerMove();
            if (computerMove !== -1) {
                board[computerMove] = '○';
                renderBoard();
                computerMoveSound.play();
                if (checkWin()) {
                    scores.player2++;
                    if (scores.player2 > scores.player1) {
                        matches.player2++;
                        if (matches.player2 >= MATCHES_TO_WIN) {
                            showResult(`Computer wins the tournament! Score: ${matches.player2}-${matches.player1}`, 'Tournament Victory!', true);
                            gameActive = false;
                            return;
                        }
                    }
                    updateScores();
                    showResult('Computer wins this round!', 'Round Victory!');
                    gameActive = false;
                    setTimeout(() => closeModal(), 1500);
                } else if (board.every(cell => cell !== '')) {
                    drawSound.play();
                    showResult("It's a draw!", 'Draw Game');
                    gameActive = false;
                    setTimeout(() => closeModal(true), 1500);
                } else {
                    currentPlayer = '✕';
                    updateStatus();
                }
            }
        }

        function launchConfetti() {
            try {
                const container = document.createElement('div');
                container.className = 'confetti-container';
                document.body.appendChild(container);
                const colors = ['#f59e0b', '#ef4444', '#10b981', '#3b82f6', '#a78bfa', '#fb7185', '#f97316'];
                const count = 80;
                for (let i = 0; i < count; i++) {
                    const el = document.createElement('div');
                    el.className = 'confetti';
                    el.style.left = Math.random() * 100 + 'vw';
                    el.style.background = colors[Math.floor(Math.random() * colors.length)];
                    el.style.opacity = (0.6 + Math.random() * 0.6).toFixed(2);
                    const w = 6 + Math.random() * 10;
                    el.style.width = w + 'px';
                    el.style.height = (w * 1.4) + 'px';
                    const delay = Math.random() * 0.6;
                    const duration = 2.4 + Math.random() * 1.6;
                    el.style.animationDelay = delay + 's';
                    el.style.animationDuration = duration + 's';
                    container.appendChild(el);
                }
                setTimeout(() => container.remove(), 5200);
            } catch (e) { console.error(e); }
        }

        let pendingNewTournament = false;
        const playerNameModal = document.getElementById('playerNameModal');
        const playerNameInput = document.getElementById('playerNameInput');
        const confirmNameBtn = document.getElementById('confirmNameBtn');

        confirmNameBtn.addEventListener('click', () => {
            const name = (playerNameInput.value || '').trim();
            if (!name) return;
            player1Name = name;
            player2Name = 'Computer';
            if (pendingNewTournament) {
                scores.player1 = 0; scores.player2 = 0; matches.player1 = 0; matches.player2 = 0; updateScores();
            }
            hidePlayerNameModal();
            playerNameInput.value = '';
            pendingNewTournament = false;
            startGame();
        });

        playerNameInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') confirmNameBtn.click(); });

        window.addEventListener('load', () => {
            player1Name = '';
            showPlayerNameModal();
        });

        function showPlayerNameModal() {
            playerNameModal.style.display = 'grid';
            playerNameInput.focus();
        }
        function hidePlayerNameModal() { playerNameModal.style.display = 'none'; }

        function startGame() {
            document.getElementById('p1name').textContent = player1Name;
            document.getElementById('p2name').textContent = player2Name;
            resetGame();
            gameActive = true;
            renderBoard();
            updateStatus();
            updateScores();
            playerMoveSound.play();
        }

        function renderBoard() {
            const boardElement = document.getElementById('board');
            boardElement.innerHTML = '';
            boardElement.classList.toggle('p1-turn', currentPlayer === '✕');
            boardElement.classList.toggle('p2-turn', currentPlayer === '○');
            board.forEach((cell, index) => {
                const cellElement = document.createElement('div');
                cellElement.className = 'cell';
                cellElement.textContent = cell;
                cellElement.addEventListener('click', () => handleCellClick(index));
                boardElement.appendChild(cellElement);
            });
        }

        function getComputerMove() {
            const possibleMoves = [];
            const winMove = findWinningMove('○');
            if (winMove !== -1) possibleMoves.push({ move: winMove, weight: 5 });
            const blockMove = findWinningMove('✕');
            if (blockMove !== -1) possibleMoves.push({ move: blockMove, weight: 4 });
            if (board[4] === '') possibleMoves.push({ move: 4, weight: 3 });
            const corners = [0, 2, 6, 8];
            corners.forEach(corner => { if (board[corner] === '') possibleMoves.push({ move: corner, weight: 2 }); });
            board.forEach((cell, index) => {
                if (cell === '' && !possibleMoves.some(p => p.move === index)) possibleMoves.push({ move: index, weight: 1 });
            });
            if (possibleMoves.length === 0) return -1;
            const weightedMoves = possibleMoves.flatMap(p => Array(p.weight).fill(p.move));
            return weightedMoves[Math.floor(Math.random() * weightedMoves.length)];
        }

        function findWinningMove(player) {
            for (let i = 0; i < 9; i++) {
                if (board[i] === '') {
                    board[i] = player;
                    if (checkWin()) { board[i] = ''; return i; }
                    board[i] = '';
                }
            }
            return -1;
        }

        function handleCellClick(index) {
            if (!gameActive || board[index] !== '' || currentPlayer !== '✕') return;
            board[index] = currentPlayer;
            renderBoard();
            playerMoveSound.play();

            if (checkWin()) {
                scores.player1++;
                if (scores.player1 > scores.player2) {
                    matches.player1++;
                    if (matches.player1 >= MATCHES_TO_WIN) {
                        showResult(`${player1Name} wins the tournament! Score: ${matches.player1}-${matches.player2}`, 'Tournament Victory!', true);
                        gameActive = false;
                        return;
                    }
                }
                updateScores();
                showResult(player1Name + ' wins this round!', 'Round Victory!');
                gameActive = false;
                setTimeout(() => closeModal(), 1500);
            } else if (board.every(cell => cell !== '')) {
                drawSound.play();
                showResult("It's a draw!", 'Draw Game');
                gameActive = false;
                setTimeout(() => closeModal(), 1500);
            } else {
                currentPlayer = '○';
                updateStatus();
                setTimeout(makeComputerMove, 500);
            }
        }

        function checkWin() {
            const winPatterns = [
                [0, 1, 2], [3, 4, 5], [6, 7, 8],
                [0, 3, 6], [1, 4, 7], [2, 5, 8],
                [0, 4, 8], [2, 4, 6]
            ];
            const hasWon = winPatterns.some(([a, b, c]) => board[a] && board[a] === board[b] && board[a] === board[c]);
            if (hasWon) winSound.play();
            return hasWon;
        }

        function updateStatus() {
            const currentPlayerName = currentPlayer === '✕' ? player1Name : player2Name;
            document.getElementById('status').textContent = `${currentPlayerName}'s turn`;
            const boardElement = document.getElementById('board');
            boardElement.classList.toggle('p1-turn', currentPlayer === '✕');
            boardElement.classList.toggle('p2-turn', currentPlayer === '○');
            document.getElementById('score-p1').classList.toggle('current', currentPlayer === '✕');
            document.getElementById('score-p2').classList.toggle('current', currentPlayer === '○');
        }

        function updateScores() {
            document.getElementById('p1score').textContent = scores.player1;
            document.getElementById('p2score').textContent = scores.player2;
            document.getElementById('p1matches').textContent = matches.player1;
            document.getElementById('p2matches').textContent = matches.player2;
        }

        function showResult(message, title, isTournamentEnd = false) {
            const modal = document.getElementById('resultModal');
            const modalTitle = document.getElementById('modalTitle');
            const modalMessage = document.getElementById('modalMessage');
            const tournamentButtons = document.getElementById('tournamentButtons');

            modalTitle.textContent = title;
            modalMessage.textContent = message;
            tournamentButtons.style.display = isTournamentEnd ? 'block' : 'none';
            modal.style.display = 'flex';

            if (isTournamentEnd) {
                launchConfetti();
                try {
                    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
                    tournamentSound.currentTime = 0;
                    tournamentSound.play().catch(err => {
                        console.warn("Tournament sound blocked:", err);
                        document.body.addEventListener("click", () => tournamentSound.play(), { once: true });
                    });
                } catch (e) { console.error(e); }
            }

            if (!isTournamentEnd) setTimeout(() => closeModal(), 1500);
        }

        function closeModal() {
            const modal = document.getElementById('resultModal');
            modal.style.display = 'none';
            if (matches.player1 >= MATCHES_TO_WIN || matches.player2 >= MATCHES_TO_WIN) showPlayerNameModal();
            resetGame();
        }

        function startNewTournament() {
            pendingNewTournament = true;
            showPlayerNameModal();
            document.getElementById('resultModal').style.display = 'none';
        }

        function resetGame() {
            board = ['', '', '', '', '', '', '', '', ''];
            currentPlayer = getRandomStartingPlayer();
            gameActive = true;
            renderBoard();
            updateStatus();
            if (playerVsComputer && currentPlayer === '○') setTimeout(makeComputerMove, 500);
        }

        function resetScores() {
            scores.player1 = 0; scores.player2 = 0; matches.player1 = 0; matches.player2 = 0;
            updateScores();
            showResult('Tournament progress has been reset!', 'Tournament Reset', false);
            setTimeout(() => closeModal(), 1500);
        }

        renderBoard();
    </script>


</body>

</html>
